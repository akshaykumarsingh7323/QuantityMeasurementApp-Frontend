<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantity Measurement</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- =================== AUTH PAGE =================== -->
    <div id="auth-page">
      <div class="auth-card">
        <!-- Hero Section -->
        <div class="auth-hero">
          <div class="stars">★ ★</div>
          <div class="stars2">★</div>
          <div class="auth-hero-icons">
            <span>🪙</span>
            <span>🌡️</span>
            <span>⚖️</span>
            <span>🧪</span>
            <span>📏</span>
          </div>
          <h2>Welcome to Quantity Measurement</h2>
        </div>

        <!-- Auth Body -->
        <div class="auth-body">
          <!-- Login / Signup Tabs -->
          <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">
              LOGIN
            </button>
            <button class="tab-btn" onclick="switchTab('signup')">
              SIGNUP
            </button>
          </div>

          <!-- ===== LOGIN FORM ===== -->
          <div id="login-form">
            <!-- Login Method Toggle -->
            <div class="login-toggle">
              <button
                class="ltoggle-btn active"
                id="lt-email"
                onclick="switchLoginMethod('email')"
              >
                📧 Email
              </button>
              <button
                class="ltoggle-btn"
                id="lt-mobile"
                onclick="switchLoginMethod('mobile')"
              >
                📱 Mobile
              </button>
            </div>

            <!-- Email Field -->
            <div id="login-email-group" class="form-group">
              <div class="input-wrap" id="wrap-lemail">
                <span class="icon">✉️</span>
                <input
                  type="text"
                  id="login-email"
                  placeholder="Enter your email"
                  oninput="liveValidateEmail()"
                />
              </div>
              <div class="field-err" id="err-lemail"></div>
            </div>

            <!-- Mobile Field (hidden by default) -->
            <div
              id="login-mobile-group"
              class="form-group"
              style="display: none"
            >
              <div class="input-wrap" id="wrap-lmobile">
                <span class="icon">📱</span>
                <input
                  type="tel"
                  id="login-mobile"
                  placeholder="Enter 10-digit mobile number"
                  maxlength="10"
                  oninput="
                    liveValidateMobile(
                      'login-mobile',
                      'wrap-lmobile',
                      'err-lmobile',
                    )
                  "
                />
              </div>
              <div class="field-err" id="err-lmobile"></div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <div class="input-wrap" id="wrap-lpass">
                <span class="icon">🔒</span>
                <input
                  type="password"
                  id="login-pass"
                  placeholder="Enter your password"
                  oninput="clearWrapErr('wrap-lpass', 'err-lpass')"
                />
                <button
                  class="toggle-eye"
                  onclick="togglePass('login-pass', this)"
                >
                  👁️
                </button>
              </div>
              <div class="field-err" id="err-lpass"></div>
            </div>

            <div class="forgot"><a href="#">Forgot password?</a></div>
            <div class="msg" id="login-msg"></div>

            <button class="btn-primary" onclick="doLogin()">Login</button>

            <div class="divider">or continue with</div>

            <button class="social-btn" onclick="googleLogin()">
              <svg class="google-icon" viewBox="0 0 48 48">
                <path
                  fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                />
                <path
                  fill="#4285F4"
                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                />
                <path
                  fill="#FBBC05"
                  d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                />
                <path
                  fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.32-8.16 2.32-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                />
                <path fill="none" d="M0 0h48v48H0z" />
              </svg>
              Continue with Google
            </button>
          </div>

          <!-- ===== SIGNUP FORM ===== -->
          <div id="signup-form" style="display: none">
            <!-- Full Name -->
            <div class="form-group">
              <div class="input-wrap" id="wrap-sname">
                <span class="icon">👤</span>
                <input
                  type="text"
                  id="signup-name"
                  placeholder="Enter your full name"
                  oninput="clearWrapErr('wrap-sname', 'err-sname')"
                />
              </div>
              <div class="field-err" id="err-sname"></div>
            </div>

            <!-- Email -->
            <div class="form-group">
              <div class="input-wrap" id="wrap-semail">
                <span class="icon">✉️</span>
                <input
                  type="text"
                  id="signup-email"
                  placeholder="Enter your email"
                  oninput="liveValidateSignupEmail()"
                />
              </div>
              <div class="field-err" id="err-semail"></div>
            </div>

            <!-- Mobile -->
            <div class="form-group">
              <div class="input-wrap" id="wrap-smobile">
                <span class="icon">📱</span>
                <input
                  type="tel"
                  id="signup-mobile"
                  placeholder="Enter 10-digit mobile number"
                  maxlength="10"
                  oninput="
                    liveValidateMobile(
                      'signup-mobile',
                      'wrap-smobile',
                      'err-smobile',
                    )
                  "
                />
              </div>
              <div class="field-err" id="err-smobile"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <div class="input-wrap" id="wrap-spass">
                <span class="icon">🔒</span>
                <input
                  type="password"
                  id="signup-pass"
                  placeholder="Create a password (min 6 chars)"
                  oninput="livePasswordStrength()"
                />
                <button
                  class="toggle-eye"
                  onclick="togglePass('signup-pass', this)"
                >
                  👁️
                </button>
              </div>

              <!-- Password Strength Bar -->
              <div
                class="pass-strength"
                id="pass-strength-wrap"
                style="display: none"
              >
                <div class="strength-bar">
                  <div class="strength-seg" id="seg1"></div>
                  <div class="strength-seg" id="seg2"></div>
                  <div class="strength-seg" id="seg3"></div>
                  <div class="strength-seg" id="seg4"></div>
                </div>
                <div class="strength-label" id="strength-label"></div>
              </div>

              <div class="field-err" id="err-spass"></div>
            </div>

            <div class="msg" id="signup-msg"></div>

            <button class="btn-primary" onclick="doSignup()">
              Create Account
            </button>

            <div class="divider">or continue with</div>

            <button class="social-btn" onclick="googleLogin()">
              <svg class="google-icon" viewBox="0 0 48 48">
                <path
                  fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                />
                <path
                  fill="#4285F4"
                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                />
                <path
                  fill="#FBBC05"
                  d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                />
                <path
                  fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.32-8.16 2.32-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                />
                <path fill="none" d="M0 0h48v48H0z" />
              </svg>
              Sign up with Google
            </button>
          </div>
        </div>
        <!-- /.auth-body -->
      </div>
      <!-- /.auth-card -->
    </div>
    <!-- /#auth-page -->

    <!-- =================== DASHBOARD PAGE =================== -->
    <div id="dashboard-page" style="display: none; flex-direction: column">
      <!-- Header -->
      <div class="dash-header">
        <h1>🔬 Welcome To Quantity Measurement</h1>
        <button class="logout-btn" onclick="doLogout()">Logout</button>
      </div>

      <!-- Body -->
      <div class="dash-body">
        <!-- Choose Type -->
        <div class="section-label">Choose Type</div>
        <div class="type-cards">
          <div class="type-card selected" onclick="selectType('Length', this)">
            <span class="icon">📏</span>
            <div class="label">Length</div>
          </div>
          <div class="type-card" onclick="selectType('Weight', this)">
            <span class="icon">⚖️</span>
            <div class="label">Weight</div>
          </div>
          <div class="type-card" onclick="selectType('Temperature', this)">
            <span class="icon">🌡️</span>
            <div class="label">Temperature</div>
          </div>
          <div class="type-card" onclick="selectType('Volume', this)">
            <span class="icon">🧪</span>
            <div class="label">Volume</div>
          </div>
        </div>

        <!-- Choose Action -->
        <div class="section-label">Choose Action</div>
        <div class="action-tabs">
          <button
            class="action-tab active"
            onclick="selectAction('Comparison', this)"
          >
            Comparison
          </button>
          <button class="action-tab" onclick="selectAction('Conversion', this)">
            Conversion
          </button>
          <button class="action-tab" onclick="selectAction('Arithmetic', this)">
            Arithmetic
          </button>
        </div>

        <!-- Arithmetic Operator Row -->
        <div id="arith-op-row" style="display: none">
          <button class="arith-op-btn active" onclick="selectOp('+', this)">
            +
          </button>
          <button class="arith-op-btn" onclick="selectOp('-', this)">−</button>
          <button class="arith-op-btn" onclick="selectOp('x', this)">×</button>
          <button class="arith-op-btn" onclick="selectOp('/', this)">÷</button>
        </div>

        <!-- Input Row -->
        <div class="measure-row">
          <div class="measure-box">
            <div class="box-label" id="from-label">FROM</div>
            <input type="number" id="val1" value="1" oninput="clearResult()" />
            <select id="unit1" onchange="clearResult()"></select>
          </div>
          <div class="measure-box" id="to-box">
            <div class="box-label" id="to-label">TO</div>
            <input
              type="number"
              id="val2"
              value="1000"
              oninput="clearResult()"
            />
            <select id="unit2" onchange="clearResult()"></select>
          </div>
        </div>

        <!-- Error & Result -->
        <div class="error-msg" id="error-msg"></div>
        <div class="result-card" id="result-card">
          <div class="result-label" id="result-label">Result</div>
          <div class="result-value" id="result-value">—</div>
          <div class="result-sub" id="result-sub"></div>
        </div>

        <button class="calc-btn" onclick="calculate()">Calculate</button>
      </div>
      <!-- /.dash-body -->
    </div>
    <!-- /#dashboard-page -->

    <script src="../javaScript/script.js"></script>
  </body>
</html>
